
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F1E8"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
    </linearGradient>
  </defs>
  <rect width="950" height="1000" fill="url(#bg)"/>

  <!-- Título -->
  <text x="30" y="28" font-size="17" font-weight="700" fill="#8A3B1E">Planta — Distribución del Espacio Interior</text>
  <text x="30" y="46" font-size="11" fill="#6B6459">Dormitorio 2 accede desde Estar (tabique de Pladur + puerta) con dos ventanas ampliadas en el lateral izquierdo</text>

  <!-- ===== Rellenos ===== -->
  <rect x="150" y="720" width="96" height="160" fill="#EFE6D8"/> <!-- Dormitorio 1 -->
  <rect x="150" y="540" width="96" height="180" fill="#EFE6D8"/> <!-- Dormitorio 2 -->
  <rect x="246" y="540" width="120" height="340" fill="#DCD5C8"/> <!-- Garaje / Acceso -->
  <rect x="150" y="440" width="216" height="88" fill="#E8DCC6"/> <!-- Estar -->
  <rect x="184" y="240" width="182" height="200" fill="#E8DCC6"/> <!-- Estar junto a Aseos -->
  <rect x="114" y="240" width="70" height="200" fill="#DCE6E8"/> <!-- Aseos -->

  <!-- ===== Muros exteriores ===== -->
  <path d="M 150,880 L 366,880 L 366,240 L 114,240 L 114,440 L 150,440 Z"
        fill="none" stroke="#C1622D" stroke-width="6.5"/>

  <!-- ===== Muros interiores (pavés/estructura, en terracota) ===== -->
  <g stroke="#C1622D" stroke-width="4.5">
    <line x1="246" y1="880" x2="246" y2="870"/>
    <line x1="246" y1="830" x2="246" y2="820"/>
    <line x1="246" y1="732" x2="246" y2="720"/>
    <line x1="150" y1="720" x2="246" y2="720"/>
    <line x1="246" y1="720" x2="246" y2="698"/>
    <line x1="246" y1="635" x2="246" y2="625"/>
    <line x1="246" y1="562" x2="246" y2="540"/>
    <line x1="246" y1="540" x2="258" y2="540"/>
    <line x1="298" y1="540" x2="308" y2="540"/>
    <line x1="354" y1="540" x2="366" y2="540"/>
    <line x1="184" y1="440" x2="184" y2="360"/>
    <line x1="184" y1="330" x2="184" y2="270"/>
    <line x1="114" y1="340" x2="184" y2="340"/>
  </g>

  <!-- ===== Tabique de Pladur (Dormitorio 2 / Estar), con puerta ===== -->
  <g stroke="#B7AFA0" stroke-width="3">
    <line x1="150" y1="534" x2="180" y2="534"/>
    <line x1="220" y1="534" x2="246" y2="534"/>
  </g>
  <text x="198" y="527" font-size="8" fill="#8A8578" text-anchor="middle">tabique Pladur</text>

  <!-- ===== Puertas (arcos) ===== -->
  <g fill="none" stroke="#8A8578" stroke-width="1.2">
    <path d="M 246,870 A 40,40 0 0 1 206,830"/>
    <path d="M 220,534 A 40,40 0 0 1 180,494"/>
    <path d="M 258,540 A 40,40 0 0 0 298,500"/>
    <path d="M 184,360 A 30,30 0 0 0 154,330"/>
    <path d="M 184,270 A 30,30 0 0 0 154,240"/>
  </g>

  <!-- Iconos sanitarios -->
  <g fill="none" stroke="#5B8794" stroke-width="1.3">
    <rect x="122" y="365" width="16" height="22" rx="4"/>
    <rect x="140" y="383" width="34" height="30" fill="#DCE6E8"/>
    <rect x="122" y="255" width="16" height="24" rx="4"/>
    <rect x="140" y="248" width="34" height="34" fill="#DCE6E8"/>
  </g>

  <!-- ===== Ventanas ===== -->
  <g stroke="#5B8794" stroke-width="3.5">
    <line x1="160" y1="880" x2="193" y2="880"/>
    <line x1="203" y1="880" x2="236" y2="880"/>
    <line x1="246" y1="820" x2="246" y2="732"/>
    <line x1="246" y1="698" x2="246" y2="635"/>
    <line x1="246" y1="625" x2="246" y2="562"/>
    <line x1="308" y1="540" x2="354" y2="540"/>
  </g>
  <line x1="258" y1="540" x2="298" y2="540" stroke="#DED7C7" stroke-width="5"/>
  <line x1="246" y1="880" x2="366" y2="880" stroke="#4A4A4A" stroke-width="4" stroke-dasharray="6 4"/>
  <line x1="366" y1="880" x2="366" y2="240" stroke="#C1622D" stroke-width="6.5"/>

  <rect x="290" y="770" width="36" height="95" rx="9" fill="#C9C2B6" opacity="0.6"/>

  <!-- ===== Etiquetas ===== -->
  <g font-family="'IBM Plex Mono', monospace" font-size="12" fill="#5A5347">
    <text x="198" y="805" text-anchor="middle">DORMITORIO 1</text>
    <text x="198" y="635" text-anchor="middle">DORMITORIO 2</text>
    <text x="306" y="715" text-anchor="middle">GARAJE / ACCESO</text>
    <text x="306" y="730" text-anchor="middle" font-size="10">8,50 m</text>
    <text x="258" y="490" text-anchor="middle">ESTAR</text>
    <text x="258" y="504" text-anchor="middle" font-size="9">(cocina integrada)</text>
    <text x="270" y="340" text-anchor="middle">ESTAR</text>
    <text x="148" y="383" text-anchor="middle" font-size="9">ASEO 1</text>
    <text x="148" y="270" text-anchor="middle" font-size="9.5">ASEO 2</text>
  </g>

  <!-- ===== Cotas de profundidad ===== -->
  <g font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#5A5347">
    <line x1="70" y1="880" x2="70" y2="720" stroke="#8A8578" stroke-width="1"/>
    <text x="55" y="800" text-anchor="middle" transform="rotate(-90 55 800)">4,00 m dorm.1</text>

    <line x1="70" y1="720" x2="70" y2="540" stroke="#8A8578" stroke-width="1"/>
    <text x="55" y="630" text-anchor="middle" transform="rotate(-90 55 630)">4,50 m dorm.2</text>

    <line x1="70" y1="440" x2="70" y2="240" stroke="#8A8578" stroke-width="1"/>
    <text x="55" y="340" text-anchor="middle" transform="rotate(-90 55 340)">5,00 m aseos</text>

    <line x1="30" y1="880" x2="30" y2="240" stroke="#8A8578" stroke-width="1"/>
    <text x="18" y="560" text-anchor="middle" transform="rotate(-90 18 560)" font-size="12" font-weight="600">16,00 m total</text>
  </g>

  <!-- ===== Cotas de ancho ===== -->
  <g font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#5A5347">
    <line x1="150" y1="898" x2="366" y2="898" stroke="#8A8578" stroke-width="1"/>
    <text x="258" y="914" text-anchor="middle">5,40 m (2,40 + 3,00)</text>

    <line x1="114" y1="225" x2="366" y2="225" stroke="#8A8578" stroke-width="1"/>
    <text x="240" y="213" text-anchor="middle">6,30 m (saliente izquierdo, zona de aseos)</text>
  </g>

  <!-- Nota -->
  <text x="30" y="950" font-size="11" fill="#8A8578">Dormitorio 2 se separa de Estar por un tabique de Pladur con puerta; Dormitorio 1 sigue accediendo directamente desde el aparcamiento.</text>
</svg>
