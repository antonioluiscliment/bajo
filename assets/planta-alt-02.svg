<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F1E8"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
    </linearGradient>
  </defs>
  <rect width="950" height="1000" fill="url(#bg)"/>

  <!-- Título -->
  <text x="30" y="28" font-size="17" font-weight="700" fill="#8A3B1E">Planta — Alternativa 2</text>
  <text x="30" y="46" font-size="11" fill="#6B6459">El eje derecho (garaje + dormitorio 2) mantiene 3,00 m solo en los primeros 6,00 m desde el frente; los 10,00 m restantes se reducen a 2,40 m. El Estar gana esos 0,60 m.</text>

  <!-- ===== Rellenos ===== -->
  <rect x="114" y="240" width="70" height="200" fill="#DCE6E8"/> <!-- Aseos -->
  <rect x="270" y="240" width="96" height="200" fill="#EFE6D8"/> <!-- Dormitorio 2 — 2,40 x 5,00 m -->
  <rect x="150" y="720" width="96" height="160" fill="#EFE6D8"/> <!-- Dormitorio 1 -->

  <!-- Garaje / Acceso: forma escalonada — 3,00 m en los primeros 6 m, 2,40 m en los 5 m restantes -->
  <path d="M 246,880 L 366,880 L 366,440 L 270,440 L 270,640 L 246,640 Z" fill="#DCD5C8"/>

  <!-- Estar: forma en L ampliada, gana los 0,60 m que cede el eje derecho a partir de los 6 m -->
  <path d="M 184,240 L 270,240 L 270,640 L 246,640 L 246,720 L 150,720 L 150,440 L 184,440 Z" fill="#E8DCC6"/>

  <!-- ===== Muros exteriores ===== -->
  <path d="M 150,880 L 366,880 L 366,240 L 114,240 L 114,440 L 150,440 Z"
        fill="none" stroke="#C1622D" stroke-width="6.5"/>

  <!-- ===== Muros interiores ===== -->
  <g stroke="#C1622D" stroke-width="4.5">
    <!-- Aseos / Estar, con las dos puertas originales a los aseos -->
    <line x1="184" y1="440" x2="184" y2="360"/>
    <line x1="184" y1="330" x2="184" y2="270"/>

    <!-- Estar / Dormitorio 2, con puerta (muro desplazado a x=270) -->
    <line x1="270" y1="240" x2="270" y2="360"/>
    <line x1="270" y1="400" x2="270" y2="440"/>

    <!-- Estar / Garaje (tramo estrecho, 2,40 m), con puerta (muro desplazado a x=270) -->
    <line x1="270" y1="440" x2="270" y2="460"/>
    <line x1="270" y1="500" x2="270" y2="640"/>

    <!-- Escalón: paso de 2,40 m a 3,00 m a los 6 m del frente -->
    <line x1="246" y1="640" x2="270" y2="640"/>

    <!-- Estar / Garaje (tramo ancho, 3,00 m) -->
    <line x1="246" y1="640" x2="246" y2="720"/>

    <!-- Dormitorio 1 / Garaje: muro ciego -->
    <line x1="246" y1="720" x2="246" y2="880"/>

    <!-- Estar / Dormitorio 1, con puerta -->
    <line x1="150" y1="720" x2="180" y2="720"/>
    <line x1="220" y1="720" x2="246" y2="720"/>
  </g>

  <!-- Cierre de fondo del garaje / Dormitorio 2 -->
  <line x1="270" y1="440" x2="366" y2="440" stroke="#C1622D" stroke-width="6.5"/>

  <!-- ===== Puertas (arcos) ===== -->
  <g fill="none" stroke="#8A8578" stroke-width="1.2">
    <path d="M 184,360 A 30,30 0 0 0 154,330"/>
    <path d="M 184,270 A 30,30 0 0 0 154,240"/>
    <!-- Estar → Dormitorio 2 -->
    <path d="M 270,400 A 40,40 0 0 0 310,360"/>
    <!-- Garaje → Estar -->
    <path d="M 270,500 A 40,40 0 0 0 310,460"/>
    <!-- Estar → Dormitorio 1 -->
    <path d="M 180,720 A 40,40 0 0 1 220,760"/>
  </g>

  <!-- Iconos sanitarios -->
  <g fill="none" stroke="#5B8794" stroke-width="1.3">
    <rect x="122" y="365" width="16" height="22" rx="4"/>
    <rect x="140" y="383" width="34" height="30" fill="#DCE6E8"/>
    <rect x="122" y="255" width="16" height="24" rx="4"/>
    <rect x="140" y="248" width="34" height="34" fill="#DCE6E8"/>
  </g>

  <!-- ===== Ventanas ===== -->
  <g stroke="#5B8794" stroke-width="3.5">
    <line x1="160" y1="880" x2="193" y2="880"/>
    <line x1="203" y1="880" x2="236" y2="880"/>
    <line x1="298" y1="240" x2="348" y2="240"/> <!-- ventana Dormitorio 2, muro de fondo -->
  </g>

  <!-- Fachada del garaje: única entrada a la vivienda, desde calle -->
  <line x1="246" y1="880" x2="366" y2="880" stroke="#4A4A4A" stroke-width="4" stroke-dasharray="6 4"/>
  <line x1="366" y1="880" x2="366" y2="240" stroke="#C1622D" stroke-width="6.5"/>

  <rect x="300" y="700" width="34" height="90" rx="9" fill="#C9C2B6" opacity="0.6"/>

  <!-- ===== Etiquetas ===== -->
  <g font-family="'IBM Plex Mono', monospace" font-size="12" fill="#5A5347">
    <text x="198" y="805" text-anchor="middle">DORMITORIO 1</text>
    <text x="198" y="600" text-anchor="middle">ESTAR</text>
    <text x="198" y="616" text-anchor="middle" font-size="9">(cocina integrada)</text>
    <text x="306" y="770" text-anchor="middle">GARAJE / ACCESO</text>
    <text x="306" y="786" text-anchor="middle" font-size="10" font-weight="700" fill="#8A3B1E">3,00 m (primeros 6,00 m)</text>
    <text x="318" y="560" text-anchor="middle" font-size="9" font-weight="700" fill="#8A3B1E">2,40 m</text>
    <text x="318" y="573" text-anchor="middle" font-size="8" fill="#8A3B1E">(resto, 10,00 m)</text>
    <text x="148" y="383" text-anchor="middle" font-size="9">ASEO 1</text>
    <text x="148" y="270" text-anchor="middle" font-size="9.5">ASEO 2</text>
    <text x="318" y="335" text-anchor="middle">DORMITORIO 2</text>
    <text x="318" y="351" text-anchor="middle" font-size="10" font-weight="700" fill="#8A3B1E">2,40 × 5,00 m</text>
  </g>

  <!-- ===== Cotas de profundidad (columna izquierda) ===== -->
  <g font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#5A5347">
    <line x1="70" y1="880" x2="70" y2="720" stroke="#8A8578" stroke-width="1"/>
    <text x="55" y="800" text-anchor="middle" transform="rotate(-90 55 800)">4,00 m dorm.1</text>

    <line x1="70" y1="720" x2="70" y2="440" stroke="#8A8578" stroke-width="1"/>
    <text x="55" y="580" text-anchor="middle" transform="rotate(-90 55 580)">7,00 m estar</text>

    <line x1="70" y1="440" x2="70" y2="240" stroke="#8A8578" stroke-width="1"/>
    <text x="55" y="340" text-anchor="middle" transform="rotate(-90 55 340)">5,00 m dorm.2 / aseos</text>

    <line x1="30" y1="880" x2="30" y2="240" stroke="#8A8578" stroke-width="1"/>
    <text x="18" y="560" text-anchor="middle" transform="rotate(-90 18 560)" font-size="12" font-weight="600">16,00 m total</text>
  </g>

  <!-- ===== Cota del eje longitudinal derecho (con el escalón a los 6 m) ===== -->
  <g font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#8A3B1E">
    <line x1="400" y1="880" x2="400" y2="640" stroke="#C1622D" stroke-width="1.2"/>
    <line x1="395" y1="880" x2="405" y2="880" stroke="#C1622D" stroke-width="1.2"/>
    <line x1="395" y1="640" x2="405" y2="640" stroke="#C1622D" stroke-width="1.2"/>
    <text x="414" y="760" text-anchor="middle" transform="rotate(-90 414 760)" font-weight="700">6,00 m · 3,00 m ancho</text>

    <line x1="400" y1="640" x2="400" y2="240" stroke="#C1622D" stroke-width="1.2"/>
    <line x1="395" y1="240" x2="405" y2="240" stroke="#C1622D" stroke-width="1.2"/>
    <text x="414" y="440" text-anchor="middle" transform="rotate(-90 414 440)" font-weight="700">10,00 m · 2,40 m ancho</text>
  </g>

  <!-- ===== Cotas de ancho ===== -->
  <g font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#5A5347">
    <line x1="150" y1="898" x2="366" y2="898" stroke="#8A8578" stroke-width="1"/>
    <text x="258" y="914" text-anchor="middle">5,40 m (2,40 + 3,00) — solo primeros 6,00 m</text>

    <line x1="114" y1="225" x2="366" y2="225" stroke="#8A8578" stroke-width="1"/>
    <text x="240" y="213" text-anchor="middle">6,30 m (1,75 aseos + 2,15 estar + 2,40 dorm.2)</text>
  </g>

  <!-- Nota -->
  <text x="30" y="945" font-size="11" fill="#8A8578">Alternativa 2: a partir de los 6,00 m desde el frente, el eje derecho (garaje/dorm.2) pierde 0,60 m de ancho.</text>
  <text x="30" y="961" font-size="11" fill="#8A8578">El Estar gana ese espacio: pasa de 2,40 a 3,00 m de ancho en el tramo trasero del garaje, y el pasillo de aseos se ensancha a 2,15 m.</text>
</svg>
    
